name: Verifica accesso fanSALE
on:
  push:
    paths:
      - .github/workflows/verifica-fansale.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Installa browser standard
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install chromium
      - name: Apri fanSALE nel browser
        run: |
          python3 - <<'PY'
          import json,re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,channel='chromium',args=['--disable-http2'])
              page=browser.new_page(locale='it-IT')
              try:
                  response=page.goto('https://www.fansale.it/tickets/all/korn/460942',wait_until='domcontentloaded',timeout=35000)
                  page.wait_for_timeout(7000)
                  print('HTTP',response.status if response else None,'URL',page.url,'TITLE',page.title())
                  print('PUBLIC_TEXT',page.locator('body').inner_text()[:6000])
                  links=page.locator('a[href]').evaluate_all('(els)=>els.map(x=>({text:x.innerText,url:x.href}))')
                  print('PUBLIC_LINKS',json.dumps([x for x in links if re.search(r'korn|search',x['text']+' '+x['url'],re.I)][:30],ensure_ascii=False))
                  scripts=page.locator('script[src]').evaluate_all('(els)=>els.map(x=>x.src)')
                  print('PUBLIC_SCRIPTS',json.dumps(scripts[:20]))
                  if response is None or response.status>=400:
                      raise RuntimeError('Pagina fanSALE non accessibile.')
              finally:
                  browser.close()
          PY
