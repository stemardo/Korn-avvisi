name: Diagnosi connessione TicketOne

on:
  push:
    paths:
      - .github/workflows/connessione-ticketone.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connessione:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Leggi la disponibilita dal catalogo Eventim
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          params = {'webId':'web__ticketone-it','language':'it','search_term':'Korn',
                    'page':1,'top':10,'sort':'DateAsc'}
          url = 'https://public-api.eventim.com/websearch/search/api/exploration/v1/products?' + urllib.parse.urlencode(params)
          with urllib.request.urlopen(urllib.request.Request(url, headers={'Accept':'application/json'}), timeout=25) as response:
              data = json.load(response)
          events = [p for p in data['products'] if str(p.get('productId')) == '21443423']
          assert len(events) == 1, 'Evento Korn non univoco nel catalogo'
          event = events[0]
          assert type(event.get('inStock')) is bool, 'Disponibilita non interpretabile'
          print(json.dumps(event, ensure_ascii=False))
          print('Accesso Eventim riuscito; inStock =', event['inStock'])
          PY
