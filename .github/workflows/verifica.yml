name: Verifica TicketOne e Telegram

on:
  workflow_dispatch:
    inputs:
      telegram:
        description: Invia anche il messaggio di prova al mio bot
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa il browser
        if: ${{ !inputs.telegram }}
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Prova la lettura di TicketOne
        if: ${{ !inputs.telegram }}
        run: python verifica.py
      - name: Prova Telegram
        if: ${{ always() && inputs.telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python verifica.py --telegram
